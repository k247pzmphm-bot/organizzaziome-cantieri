<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Cantieri Stufe</title>
<style>
  :root{
    --bg:#F5F2EC;
    --panel:#FFFFFF;
    --ink:#332E28;
    --ink-soft:#8A8175;
    --line:#E7E1D5;
    --ember:#A9673E;
    --ember-soft:#EFE1D2;
    --teal:#3C7C74;
    --teal-soft:#E2EDEA;
    --amber:#A5793A;
    --amber-soft:#F1E6D3;
    --free:#54886A;
    --free-soft:#E4EEE7;
    --error:#B2503F;
    --error-soft:#F4E1DB;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #root{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

  header.top{
    padding:22px 18px 16px;
    position:sticky; top:0; z-index:10;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
  }
  .brand{display:flex;align-items:baseline;gap:8px;}
  .brand .flame{font-size:20px;}
  h1{
    font-weight:700;
    font-size:23px;
    margin:0;
    letter-spacing:-0.01em;
  }
  .sub{color:var(--ink-soft);font-size:13px;margin-top:4px;}

  .menu-btn{
    flex-shrink:0;
    width:40px;height:40px;
    border:1px solid var(--line);
    background:var(--panel);
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    margin-top:2px;
  }
  .menu-btn span{display:block;width:16px;height:2px;background:var(--ink);position:relative;}
  .menu-btn span::before, .menu-btn span::after{
    content:'';position:absolute;left:0;width:16px;height:2px;background:var(--ink);
  }
  .menu-btn span::before{top:-5px;}
  .menu-btn span::after{top:5px;}

  .drawer-overlay{
    position:fixed;inset:0;background:rgba(34,31,28,0.35);
    z-index:19;
    opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .drawer-overlay.open{opacity:1;pointer-events:auto;}

  .drawer{
    position:fixed;top:0;left:0;bottom:0;
    width:78%;max-width:300px;
    background:var(--panel);
    z-index:20;
    box-shadow:2px 0 24px rgba(34,31,28,0.18);
    transform:translateX(-100%);
    transition:transform .22s ease;
    display:flex;flex-direction:column;
    padding:20px 0;
  }
  .drawer.open{transform:translateX(0);}
  .drawer-head{
    padding:0 20px 18px;
    border-bottom:1px solid var(--line);
    margin-bottom:8px;
    font-weight:700;font-size:16px;
    display:flex;align-items:center;gap:8px;
  }
  .drawer-nav button{
    display:block;
    width:100%;
    text-align:left;
    border:none;background:transparent;
    padding:14px 20px;
    font-size:15px;font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
    border-left:3px solid transparent;
  }
  .drawer-nav button.active{
    color:var(--ember);
    background:var(--ember-soft);
    border-left-color:var(--ember);
  }

  main{flex:1;padding:16px 18px 100px;}

  .empty{
    text-align:center;
    padding:48px 20px;
    color:var(--ink-soft);
  }
  .empty .flame{font-size:28px;display:block;margin-bottom:10px;}

  .month-label{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-soft);
    margin:22px 0 10px;
    font-weight:600;
  }
  .month-label:first-child{margin-top:0;}

  .month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .month-nav button{
    border:1px solid var(--line);background:var(--panel);color:var(--ink);
    width:34px;height:34px;border-radius:9px;font-size:17px;cursor:pointer;
  }
  .month-nav-label{font-weight:700;font-size:15px;}

  .week-labels{
    display:grid;grid-template-columns:repeat(7,1fr);
    text-align:center;font-size:11px;color:var(--ink-soft);font-weight:600;
    margin-bottom:6px;
  }

  .month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px;}
  .cal-cell{
    aspect-ratio:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    border-radius:10px;cursor:pointer;
    background:var(--panel);border:1px solid var(--line);
  }
  .cal-cell.empty{visibility:hidden;cursor:default;}
  .cal-cell.today{border-color:var(--ember);}
  .cal-cell.selected{background:var(--ember-soft);border-color:var(--ember);}
  .cal-daynum{font-size:13px;font-weight:600;}
  .cal-dots{display:flex;gap:2px;height:6px;}
  .cal-dot{width:6px;height:6px;border-radius:50%;border:1.5px solid var(--line);background:transparent;}
  .cal-dot.A{border-color:var(--teal);}
  .cal-dot.B{border-color:var(--amber);}
  .cal-dot.filled.A{background:var(--teal);}
  .cal-dot.filled.B{background:var(--amber);}

  .day-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    margin-bottom:10px;
    overflow:hidden;
  }
  .day-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 14px 8px;
  }
  .day-date{font-weight:700;font-size:15px;}

  .slot-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 14px;
    border-top:1px solid var(--line);
  }
  .team-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .team-dot.A{background:var(--teal);}
  .team-dot.B{background:var(--amber);}

  .slot-info{flex:1;min-width:0;}
  .slot-team{font-size:11px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:0.03em;}
  .slot-main{font-size:14px;font-weight:600;margin-top:1px;}
  .slot-main.free{color:var(--free);}
  .slot-detail{font-size:12.5px;color:var(--ink-soft);margin-top:1px;}

  .badge{
    font-size:11px;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    flex-shrink:0;
    white-space:nowrap;
  }
  .badge.free{background:var(--free-soft);color:var(--free);}
  .badge.busy{background:var(--ember-soft);color:var(--ember);}

  .slot-row button.icon-btn{
    border:none;background:none;color:var(--ink-soft);
    font-size:16px;cursor:pointer;padding:4px 6px;flex-shrink:0;
  }
  .expand-arrow{
    font-size:11px;color:var(--ink-soft);flex-shrink:0;transition:transform .15s;
  }
  .expand-arrow.open{transform:rotate(180deg);}

  .job-expand{
    padding:4px 14px 14px 33px;
    display:flex;flex-direction:column;gap:7px;
  }
  .job-expand-row{display:flex;gap:10px;font-size:13.5px;}
  .jx-label{
    flex:0 0 78px;color:var(--ink-soft);font-size:11.5px;font-weight:600;
    text-transform:uppercase;letter-spacing:0.02em;padding-top:1px;
  }
  .jx-val{flex:1;color:var(--ink);word-break:break-word;}
  .jx-link{color:var(--teal);text-decoration:none;font-weight:600;}
  .del-job-btn{
    align-self:flex-start;
    border:none;background:var(--error-soft);color:var(--error);
    border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:600;
    cursor:pointer;margin-top:4px;
  }
  .del-job-btn.confirming, .pending-card .actions button.del.confirming, .icon-btn.confirming{
    background:var(--error);color:#fff;
  }

  form{display:flex;flex-direction:column;gap:14px;}
  .field label{
    display:block;font-size:12px;font-weight:600;color:var(--ink-soft);
    margin-bottom:6px;text-transform:uppercase;letter-spacing:0.03em;
  }
  .field input, .field select, .field textarea{
    width:100%;
    border:1px solid var(--line);
    background:var(--panel);
    border-radius:10px;
    padding:11px 12px;
    font-family:inherit;
    font-size:15px;
    color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:60px;}
  .team-choice{display:flex;gap:8px;}
  .team-choice button{
    flex:1;
    border:1.5px solid var(--line);
    background:var(--panel);
    border-radius:10px;
    padding:10px;
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .team-choice button.sel.A{border-color:var(--teal);background:var(--teal-soft);color:var(--teal);}
  .team-choice button.sel.B{border-color:var(--amber);background:var(--amber-soft);color:var(--amber);}

  .primary-btn{
    background:var(--ember);
    color:#fff;
    border:none;
    border-radius:12px;
    padding:14px;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    margin-top:4px;
  }

  .slot-pick{
    display:flex;flex-direction:column;gap:6px;
    max-height:260px;overflow:auto;
    border:1px solid var(--line);border-radius:10px;padding:6px;
  }
  .slot-pick .opt{
    display:flex;align-items:center;gap:8px;
    padding:9px 10px;border-radius:8px;cursor:pointer;font-size:14px;
  }
  .slot-pick .opt:hover{background:var(--bg);}
  .slot-pick .opt.sel{background:var(--ember-soft);}
  .slot-pick .opt input{margin:0;}
  .slot-pick .empty-note{font-size:13px;color:var(--ink-soft);padding:6px;}

  .pending-card{
    background:var(--panel);
    border:1px solid var(--ember-soft);
    border-left:3px solid var(--ember);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:10px;
  }
  .pending-card .name{font-weight:700;font-size:14.5px;}
  .pending-card .meta{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .pending-card .actions{display:flex;gap:8px;margin-top:10px;}
  .pending-card .actions button{
    border:none;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;
  }
  .pending-card .actions .assign{background:var(--ember);color:#fff;}
  .pending-card .actions .del{background:var(--bg);color:var(--ink-soft);}

  .backup-row{display:flex;gap:8px;margin-top:12px;}
  .backup-btn{
    flex:1;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink);
    border-radius:10px;
    padding:9px 8px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
  }
  .banner-err{
    background:var(--error-soft);color:var(--error);padding:12px 14px;border-radius:10px;font-size:13px;margin-bottom:12px;line-height:1.5;
  }
  .banner-err strong{display:block;margin-bottom:3px;}
  .loading{padding:40px;text-align:center;color:var(--ink-soft);}

  ::-webkit-scrollbar{width:0;height:0;}
</style>
</head>
<body>
<div id="root"><div class="loading">Carico i dati...</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  // ====== CONFIGURAZIONE SUPABASE ======
  const SUPABASE_URL = 'https://skywsgcnjmwgtbwuveqr.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_LuejoDPsKr8zdtGg2YUXzw_v1zVYJqH';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  // ======================================

  const STORAGE_KEY = 'stufe-app-data';
  const DOW = ['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
  const MONTHS = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];

  let data = { teams: { A: 'DaFra', B: 'Arte Fuoco' }, slots: [], jobs: [], assistances: [] };
  let tab = 'calendario';
  let saveErr = false;
  let menuOpen = false;

  // stato temporaneo dei form
  let formGiorno = { team: 'A', date: todayISO(), note: '' };
  let formLavoro = { client:'', phone:'', address:'', product:'', price:'', notes:'', slotId:'' };
  let assigningJobId = null;
  let expandedSlotId = null;
  let expandedJobId = null;
  let confirmDeleteJobId = null;
  let confirmDeleteSlotId = null;

  // --- Assistenza: sezione indipendente, nessun collegamento a slots/jobs ---
  let formAssist = { client:'', phone:'', address:'', description:'', date:'', notes:'' };
  let assistFormOpen = false;
  let expandedAssistId = null;
  let confirmDeleteAssistId = null;

  // --- Calendario completo (vista mensile) ---
  let calViewYear = (new Date()).getFullYear();
  let calViewMonth = (new Date()).getMonth();
  let calSelectedDate = null;

  function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
  function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
  function fmtDate(iso){
    const d = new Date(iso+'T00:00:00');
    return { day: d.getDate(), dow: DOW[d.getDay()], month: d.getMonth(), year: d.getFullYear() };
  }
  function esc(s){
    return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function load(){
    try {
      const { data: row, error } = await sb.from('app_storage').select('value').eq('key', STORAGE_KEY).maybeSingle();
      if (error) throw error;
      if (row && row.value) data = row.value;
    } catch(e) { /* nessun dato salvato ancora, o errore di connessione: si parte da dati vuoti */ }
    if (!Array.isArray(data.assistances)) data.assistances = [];
    // migrazione: se erano ancora i nomi generici di prima, passa ai nomi reali
    if (data.teams && data.teams.A === 'Squadra 1' && data.teams.B === 'Squadra 2') {
      data.teams = { A: 'DaFra', B: 'Arte Fuoco' };
      persist();
      return;
    }
    // migrazione: rinomina la squadra "Fra" nel nuovo nome "DaFra"
    if (data.teams && data.teams.A === 'Fra') {
      data.teams.A = 'DaFra';
      persist();
      return;
    }
    render();
  }

  async function persist(){
    try {
      const { error } = await sb.from('app_storage').upsert({ key: STORAGE_KEY, value: data, updated_at: new Date().toISOString() });
      saveErr = !!error;
    } catch(e) { saveErr = true; }
    render();
  }

  function setTab(t){ tab = t; assigningJobId = null; confirmDeleteJobId = null; confirmDeleteSlotId = null; confirmDeleteAssistId = null; menuOpen = false; render(); }

  // ---------- azioni ----------
  function addSlot(e){
    e.preventDefault();
    if (!formGiorno.date) return;
    data.slots.push({ id: uid(), team: formGiorno.team, date: formGiorno.date, jobId: null, note: formGiorno.note.trim() });
    formGiorno = { team: 'A', date: todayISO(), note: '' };
    tab = 'calendario';
    persist();
  }

  function addJob(e){
    e.preventDefault();
    if (!formLavoro.client.trim()) return;
    const job = {
      id: uid(), client: formLavoro.client.trim(), phone: formLavoro.phone.trim(),
      address: formLavoro.address.trim(), product: formLavoro.product.trim(),
      price: formLavoro.price.trim(), notes: formLavoro.notes.trim(),
      slotId: formLavoro.slotId || null, createdAt: todayISO()
    };
    data.jobs.push(job);
    if (formLavoro.slotId) {
      const slot = data.slots.find(s => s.id === formLavoro.slotId);
      if (slot) slot.jobId = job.id;
    }
    formLavoro = { client:'', phone:'', address:'', product:'', price:'', notes:'', slotId:'' };
    tab = 'calendario';
    persist();
  }

  function unassignSlot(slotId){
    const slot = data.slots.find(s => s.id === slotId);
    if (!slot || !slot.jobId) return;
    const job = data.jobs.find(j => j.id === slot.jobId);
    if (job) job.slotId = null;
    slot.jobId = null;
    persist();
  }

  function removeSlot(slotId){
    const slot = data.slots.find(s => s.id === slotId);
    if (!slot) return;
    if (slot.jobId) {
      const job = data.jobs.find(j => j.id === slot.jobId);
      if (job) job.slotId = null;
    }
    data.slots = data.slots.filter(s => s.id !== slotId);
    confirmDeleteSlotId = null;
    persist();
  }

  function requestRemoveSlot(slotId){
    if (confirmDeleteSlotId === slotId) { removeSlot(slotId); return; }
    confirmDeleteSlotId = slotId;
    render();
  }

  function assignJobToSlot(jobId, slotId){
    const job = data.jobs.find(j => j.id === jobId);
    const slot = data.slots.find(s => s.id === slotId);
    if (!job || !slot) return;
    job.slotId = slotId;
    slot.jobId = jobId;
    assigningJobId = null;
    persist();
  }

  function deleteJob(jobId){
    const job = data.jobs.find(j => j.id === jobId);
    if (job && job.slotId) {
      const slot = data.slots.find(s => s.id === job.slotId);
      if (slot) slot.jobId = null;
    }
    data.jobs = data.jobs.filter(j => j.id !== jobId);
    confirmDeleteJobId = null;
    persist();
  }

  function requestDeleteJob(jobId){
    if (confirmDeleteJobId === jobId) { deleteJob(jobId); return; }
    confirmDeleteJobId = jobId;
    render();
  }

  // ---------- Assistenza (sezione indipendente) ----------
  function addAssist(e){
    e.preventDefault();
    if (!formAssist.client.trim()) return;
    data.assistances.push({
      id: uid(), client: formAssist.client.trim(), phone: formAssist.phone.trim(),
      address: formAssist.address.trim(), description: formAssist.description.trim(),
      date: formAssist.date, notes: formAssist.notes.trim(),
      done: false, createdAt: todayISO()
    });
    formAssist = { client:'', phone:'', address:'', description:'', date:'', notes:'' };
    assistFormOpen = false;
    persist();
  }

  function toggleAssistDone(id){
    const a = data.assistances.find(x => x.id === id);
    if (!a) return;
    a.done = !a.done;
    persist();
  }

  function deleteAssist(id){
    data.assistances = data.assistances.filter(x => x.id !== id);
    confirmDeleteAssistId = null;
    persist();
  }

  function requestDeleteAssist(id){
    if (confirmDeleteAssistId === id) { deleteAssist(id); return; }
    confirmDeleteAssistId = id;
    render();
  }

  // ---------- Calendario completo ----------
  function calPrevMonth(){
    calViewMonth--; if (calViewMonth < 0) { calViewMonth = 11; calViewYear--; }
    calSelectedDate = null; render();
  }
  function calNextMonth(){
    calViewMonth++; if (calViewMonth > 11) { calViewMonth = 0; calViewYear++; }
    calSelectedDate = null; render();
  }
  function calSelectDay(iso){
    calSelectedDate = calSelectedDate === iso ? null : iso; render();
  }


  // ---------- render helpers ----------
  function freeSlotsList(){
    return data.slots.filter(s => !s.jobId && s.date >= todayISO()).sort((a,b)=>a.date.localeCompare(b.date));
  }

  function renderCalendario(){
    const upcoming = data.slots.filter(s => s.date >= todayISO()).sort((a,b) => a.date.localeCompare(b.date) || a.team.localeCompare(b.team));
    if (upcoming.length === 0) {
      return '<div class="empty"><span class="flame">🪵</span>Nessun giorno disponibile in calendario.<br>Aggiungine uno dalla scheda "+ Giorno".</div>';
    }
    const byDate = {};
    upcoming.forEach(s => { (byDate[s.date] = byDate[s.date] || []).push(s); });

    let html = '';
    let lastMonth = null;
    Object.keys(byDate).sort().forEach(date => {
      const { day, dow, month, year } = fmtDate(date);
      const mk = year+'-'+month;
      if (mk !== lastMonth) {
        html += `<div class="month-label">${MONTHS[month]} ${year}</div>`;
        lastMonth = mk;
      }
      html += `<div class="day-card"><div class="day-head"><div class="day-date">${day} ${dow}</div></div>`;
      byDate[date].forEach(slot => {
        const job = slot.jobId ? data.jobs.find(j => j.id === slot.jobId) : null;
        const teamName = esc(data.teams[slot.team]);
        const isOpen = job && expandedSlotId === slot.id;
        html += `<div class="slot-row" ${job ? `onclick="App.toggleExpand('${slot.id}')" style="cursor:pointer"` : ''}>
          <span class="team-dot ${slot.team}"></span>
          <div class="slot-info">
            <div class="slot-team">${teamName}</div>`;
        if (job) {
          const detail = [job.product, job.address].filter(Boolean).map(esc).join(' · ');
          html += `<div class="slot-main">${esc(job.client)}</div><div class="slot-detail">${detail}</div>`;
        } else {
          html += `<div class="slot-main free">Libero${slot.note ? ' · '+esc(slot.note) : ''}</div>`;
        }
        html += `</div>`;
        if (job) {
          html += `<span class="expand-arrow ${isOpen?'open':''}">▾</span><span class="badge busy">Occupato</span><button class="icon-btn" onclick="event.stopPropagation();App.unassignSlot('${slot.id}')" title="Libera il giorno">↺</button>`;
        } else {
          html += `<span class="badge free">Libero</span><button class="icon-btn ${confirmDeleteSlotId===slot.id?'confirming':''}" onclick="App.requestRemoveSlot('${slot.id}')" title="Elimina giorno">${confirmDeleteSlotId===slot.id?'Sicuro?':'✕'}</button>`;
        }
        html += `</div>`;
        if (isOpen) {
          html += `<div class="job-expand">`;
          html += `<div class="job-expand-row"><span class="jx-label">Cliente</span><span class="jx-val">${esc(job.client)}</span></div>`;
          if (job.phone) html += `<div class="job-expand-row"><span class="jx-label">Telefono</span><a class="jx-val jx-link" href="tel:${esc(job.phone)}" onclick="event.stopPropagation()">${esc(job.phone)}</a></div>`;
          if (job.address) html += `<div class="job-expand-row"><span class="jx-label">Indirizzo</span><span class="jx-val">${esc(job.address)}</span></div>`;
          if (job.product) html += `<div class="job-expand-row"><span class="jx-label">Prodotto</span><span class="jx-val">${esc(job.product)}</span></div>`;
          if (job.price) html += `<div class="job-expand-row"><span class="jx-label">Prezzo</span><span class="jx-val">${esc(job.price)}</span></div>`;
          if (job.notes) html += `<div class="job-expand-row"><span class="jx-label">Note</span><span class="jx-val">${esc(job.notes)}</span></div>`;
          html += `<button class="del-job-btn ${confirmDeleteJobId===job.id?'confirming':''}" onclick="event.stopPropagation();App.requestDeleteJob('${job.id}')">${confirmDeleteJobId===job.id?'Sicuro? Tocca per confermare':'Elimina lavoro'}</button>`;
          html += `</div>`;
        }
      });
      html += `</div>`;
    });
    return html;
  }

  function renderCalendarioMese(){
    const first = new Date(calViewYear, calViewMonth, 1);
    const startWeekday = (first.getDay() + 6) % 7; // lunedì=0
    const daysInMonth = new Date(calViewYear, calViewMonth + 1, 0).getDate();
    const todayStr = todayISO();

    const slotsByDate = {};
    data.slots.forEach(s => { (slotsByDate[s.date] = slotsByDate[s.date] || []).push(s); });

    let html = `<div class="month-nav">
      <button onclick="App.calPrevMonth()">‹</button>
      <div class="month-nav-label">${MONTHS[calViewMonth]} ${calViewYear}</div>
      <button onclick="App.calNextMonth()">›</button>
    </div>`;

    html += `<div class="week-labels">${['L','M','M','G','V','S','D'].map(d => `<span>${d}</span>`).join('')}</div>`;
    html += `<div class="month-grid">`;
    for (let i = 0; i < startWeekday; i++) html += `<div class="cal-cell empty"></div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const iso = `${calViewYear}-${String(calViewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const daySlots = slotsByDate[iso] || [];
      const isToday = iso === todayStr;
      const isSel = iso === calSelectedDate;
      const dots = daySlots.map(s => `<span class="cal-dot ${s.team} ${s.jobId?'filled':''}"></span>`).join('');
      html += `<div class="cal-cell ${isToday?'today':''} ${isSel?'selected':''}" onclick="App.calSelectDay('${iso}')">
        <span class="cal-daynum">${d}</span>
        <span class="cal-dots">${dots}</span>
      </div>`;
    }
    html += `</div>`;

    if (calSelectedDate) {
      const daySlots = (slotsByDate[calSelectedDate] || []).slice().sort((a,b) => a.team.localeCompare(b.team));
      const { day, dow, month, year } = fmtDate(calSelectedDate);
      html += `<div class="month-label">${day} ${MONTHS[month]} ${year} · ${dow}</div>`;
      if (daySlots.length === 0) {
        html += `<div class="empty" style="padding:24px"><span class="flame">🪵</span>Nessun giorno impostato per questa data.</div>`;
      } else {
        html += `<div class="day-card">`;
        daySlots.forEach(slot => {
          const job = slot.jobId ? data.jobs.find(j => j.id === slot.jobId) : null;
          const teamName = esc(data.teams[slot.team]);
          html += `<div class="slot-row">
            <span class="team-dot ${slot.team}"></span>
            <div class="slot-info">
              <div class="slot-team">${teamName}</div>
              <div class="slot-main ${job?'':'free'}">${job ? esc(job.client) : 'Libero' + (slot.note ? ' · '+esc(slot.note) : '')}</div>
            </div>
            <span class="badge ${job?'busy':'free'}">${job?'Occupato':'Libero'}</span>
          </div>`;
        });
        html += `</div><div style="font-size:12.5px;color:var(--ink-soft);margin-top:8px">Per i dettagli completi o per modificare, usa la scheda "Calendario".</div>`;
      }
    }
    return html;
  }

  function renderAggiungiGiorno(){
    return `<form onsubmit="App.addSlot(event)">
      <div class="field">
        <label>Squadra</label>
        <div class="team-choice">
          <button type="button" class="${formGiorno.team==='A'?'sel A':''}" onclick="App.setFormGiornoTeam('A')">${esc(data.teams.A)}</button>
          <button type="button" class="${formGiorno.team==='B'?'sel B':''}" onclick="App.setFormGiornoTeam('B')">${esc(data.teams.B)}</button>
        </div>
      </div>
      <div class="field">
        <label>Data disponibile</label>
        <input type="date" value="${formGiorno.date}" oninput="App.setFormGiorno('date', this.value)" required>
      </div>
      <div class="field">
        <label>Nota (opzionale)</label>
        <input type="text" placeholder="es. solo mattina, zona nord..." value="${esc(formGiorno.note)}" oninput="App.setFormGiorno('note', this.value)">
      </div>
      <button class="primary-btn" type="submit">Aggiungi giorno disponibile</button>
    </form>`;
  }

  function renderNuovoLavoro(){
    const free = freeSlotsList();
    let slotPickHtml = '';
    if (free.length === 0) {
      slotPickHtml = `<div style="font-size:13px;color:var(--ink-soft)">Nessun giorno libero al momento. Il lavoro resterà "in attesa" finché non aggiungi un giorno.</div>`;
    } else {
      slotPickHtml = `<div class="slot-pick">
        <label class="opt ${formLavoro.slotId===''?'sel':''}">
          <input type="radio" name="slot" ${formLavoro.slotId===''?'checked':''} onchange="App.setFormLavoro('slotId','')">
          Non assegnare ora
        </label>`;
      free.forEach(s => {
        const { day, dow, month } = fmtDate(s.date);
        slotPickHtml += `<label class="opt ${formLavoro.slotId===s.id?'sel':''}">
          <input type="radio" name="slot" ${formLavoro.slotId===s.id?'checked':''} onchange="App.setFormLavoro('slotId','${s.id}')">
          ${day} ${MONTHS[month]} · ${dow} — ${esc(data.teams[s.team])}
        </label>`;
      });
      slotPickHtml += `</div>`;
    }

    return `<form onsubmit="App.addJob(event)">
      <div class="field"><label>Cliente</label>
        <input type="text" value="${esc(formLavoro.client)}" oninput="App.setFormLavoro('client', this.value)" placeholder="Nome e cognome" required></div>
      <div class="field"><label>Telefono</label>
        <input type="text" value="${esc(formLavoro.phone)}" oninput="App.setFormLavoro('phone', this.value)" placeholder="333 1234567"></div>
      <div class="field"><label>Indirizzo</label>
        <input type="text" value="${esc(formLavoro.address)}" oninput="App.setFormLavoro('address', this.value)" placeholder="Via, città"></div>
      <div class="field"><label>Prodotto / modello</label>
        <input type="text" value="${esc(formLavoro.product)}" oninput="App.setFormLavoro('product', this.value)" placeholder="es. Stufa a pellet 9kW"></div>
      <div class="field"><label>Note</label>
        <textarea oninput="App.setFormLavoro('notes', this.value)" placeholder="Dettagli utili per il montaggio">${esc(formLavoro.notes)}</textarea></div>
      <div class="field"><label>Assegna a un giorno libero (opzionale)</label>${slotPickHtml}</div>
      <button class="primary-btn" type="submit">Salva lavoro confermato</button>
    </form>`;
  }

  function renderInAttesa(){
    const pending = data.jobs.filter(j => !j.slotId);
    if (pending.length === 0) {
      return '<div class="empty"><span class="flame">✅</span>Nessun lavoro in attesa di assegnazione.</div>';
    }
    const free = freeSlotsList();
    let html = '';
    pending.forEach(job => {
      const meta = [job.product, job.phone, job.address].filter(Boolean).map(esc).join(' · ') || 'Nessun dettaglio';
      const isOpen = expandedJobId === job.id;
      html += `<div class="pending-card">
        <div onclick="App.toggleExpandJob('${job.id}')" style="cursor:pointer">
          <div class="name">${esc(job.client)} <span class="expand-arrow ${isOpen?'open':''}">▾</span></div>
          <div class="meta">${meta}</div>
        </div>`;
      if (isOpen) {
        html += `<div class="job-expand" style="padding-left:0">`;
        if (job.phone) html += `<div class="job-expand-row"><span class="jx-label">Telefono</span><a class="jx-val jx-link" href="tel:${esc(job.phone)}" onclick="event.stopPropagation()">${esc(job.phone)}</a></div>`;
        if (job.address) html += `<div class="job-expand-row"><span class="jx-label">Indirizzo</span><span class="jx-val">${esc(job.address)}</span></div>`;
        if (job.product) html += `<div class="job-expand-row"><span class="jx-label">Prodotto</span><span class="jx-val">${esc(job.product)}</span></div>`;
        if (job.price) html += `<div class="job-expand-row"><span class="jx-label">Prezzo</span><span class="jx-val">${esc(job.price)}</span></div>`;
        if (job.notes) html += `<div class="job-expand-row"><span class="jx-label">Note</span><span class="jx-val">${esc(job.notes)}</span></div>`;
        html += `</div>`;
      }
      html += `<div class="actions">
          <button class="assign" onclick="App.toggleAssign('${job.id}')">${assigningJobId===job.id?'Chiudi':'Assegna a un giorno'}</button>
          <button class="del ${confirmDeleteJobId===job.id?'confirming':''}" onclick="App.requestDeleteJob('${job.id}')">${confirmDeleteJobId===job.id?'Sicuro? Conferma':'Elimina'}</button>
        </div>`;
      if (assigningJobId === job.id) {
        html += `<div class="slot-pick" style="margin-top:10px">`;
        if (free.length === 0) {
          html += `<div class="empty-note">Nessun giorno libero disponibile.</div>`;
        } else {
          free.forEach(s => {
            const { day, dow, month } = fmtDate(s.date);
            html += `<div class="opt" onclick="App.assignJobToSlot('${job.id}','${s.id}')">${day} ${MONTHS[month]} · ${dow} — ${esc(data.teams[s.team])}</div>`;
          });
        }
        html += `</div>`;
      }
      html += `</div>`;
    });
    return html;
  }

  function renderAssistenza(){
    let html = `<button class="primary-btn" style="margin-bottom:16px" onclick="App.toggleAssistForm()">${assistFormOpen ? 'Chiudi' : '+ Nuovo intervento'}</button>`;

    if (assistFormOpen) {
      html += `<form onsubmit="App.addAssist(event)" style="margin-bottom:22px">
        <div class="field"><label>Cliente</label>
          <input type="text" value="${esc(formAssist.client)}" oninput="App.setFormAssist('client', this.value)" placeholder="Nome e cognome" required></div>
        <div class="field"><label>Telefono</label>
          <input type="text" value="${esc(formAssist.phone)}" oninput="App.setFormAssist('phone', this.value)" placeholder="333 1234567"></div>
        <div class="field"><label>Indirizzo</label>
          <input type="text" value="${esc(formAssist.address)}" oninput="App.setFormAssist('address', this.value)" placeholder="Via, città"></div>
        <div class="field"><label>Problema / intervento richiesto</label>
          <input type="text" value="${esc(formAssist.description)}" oninput="App.setFormAssist('description', this.value)" placeholder="es. Stufa non si accende"></div>
        <div class="field"><label>Data prevista (opzionale)</label>
          <input type="date" value="${formAssist.date}" oninput="App.setFormAssist('date', this.value)"></div>
        <div class="field"><label>Note</label>
          <textarea oninput="App.setFormAssist('notes', this.value)" placeholder="Dettagli utili">${esc(formAssist.notes)}</textarea></div>
        <button class="primary-btn" type="submit">Salva intervento</button>
      </form>`;
    }

    const pending = data.assistances.filter(a => !a.done).sort((a,b) => (a.date||'9999').localeCompare(b.date||'9999'));
    const done = data.assistances.filter(a => a.done).sort((a,b) => b.createdAt.localeCompare(a.createdAt));

    if (pending.length === 0 && done.length === 0) {
      html += '<div class="empty"><span class="flame">🔧</span>Nessun intervento in elenco.</div>';
      return html;
    }

    function assistCard(a){
      const isOpen = expandedAssistId === a.id;
      const dateLabel = a.date ? (() => { const { day, dow, month } = fmtDate(a.date); return `${day} ${MONTHS[month]} · ${dow}`; })() : 'Nessuna data';
      let c = `<div class="pending-card">
        <div onclick="App.toggleExpandAssist('${a.id}')" style="cursor:pointer">
          <div class="name">${esc(a.client)} <span class="expand-arrow ${isOpen?'open':''}">▾</span></div>
          <div class="meta">${esc(a.description) || 'Nessun dettaglio'} · ${dateLabel}</div>
        </div>`;
      if (isOpen) {
        c += `<div class="job-expand" style="padding-left:0">`;
        if (a.phone) c += `<div class="job-expand-row"><span class="jx-label">Telefono</span><a class="jx-val jx-link" href="tel:${esc(a.phone)}" onclick="event.stopPropagation()">${esc(a.phone)}</a></div>`;
        if (a.address) c += `<div class="job-expand-row"><span class="jx-label">Indirizzo</span><span class="jx-val">${esc(a.address)}</span></div>`;
        if (a.description) c += `<div class="job-expand-row"><span class="jx-label">Intervento</span><span class="jx-val">${esc(a.description)}</span></div>`;
        if (a.date) c += `<div class="job-expand-row"><span class="jx-label">Data</span><span class="jx-val">${dateLabel}</span></div>`;
        if (a.notes) c += `<div class="job-expand-row"><span class="jx-label">Note</span><span class="jx-val">${esc(a.notes)}</span></div>`;
        c += `</div>`;
      }
      c += `<div class="actions">
          <button class="assign" onclick="App.toggleAssistDone('${a.id}')">${a.done ? '↺ Riapri' : '✓ Segna fatto'}</button>
          <button class="del ${confirmDeleteAssistId===a.id?'confirming':''}" onclick="App.requestDeleteAssist('${a.id}')">${confirmDeleteAssistId===a.id?'Sicuro? Conferma':'Elimina'}</button>
        </div>
      </div>`;
      return c;
    }

    if (pending.length > 0) {
      html += `<div class="month-label">Da fare</div>`;
      pending.forEach(a => { html += assistCard(a); });
    }
    if (done.length > 0) {
      html += `<div class="month-label">Completati</div>`;
      done.forEach(a => { html += assistCard(a); });
    }
    return html;
  }

  function render(){
    const root = document.getElementById('root');
    let html = `
      <header class="top">
        <div>
          <div class="brand"><span class="flame">🔥</span><h1>Cantieri Stufe</h1></div>
          <div class="sub">Giorni squadre e lavori confermati</div>
          <div class="backup-row">
            <button class="backup-btn" onclick="App.exportData()">⬇ Esporta dati</button>
            <button class="backup-btn" onclick="document.getElementById('importFile').click()">⬆ Importa dati</button>
            <input type="file" id="importFile" accept=".json" style="display:none" onchange="App.importData(event)">
          </div>
        </div>
        <button class="menu-btn" onclick="App.toggleMenu()" aria-label="Apri menu"><span></span></button>
      </header>
      <div class="drawer-overlay ${menuOpen?'open':''}" onclick="App.toggleMenu()"></div>
      <div class="drawer ${menuOpen?'open':''}">
        <div class="drawer-head"><span class="flame">🔥</span>Cantieri Stufe</div>
        <nav class="drawer-nav">
          <button class="${tab==='calendario'?'active':''}" onclick="App.setTab('calendario')">📅 Calendario</button>
          <button class="${tab==='mese'?'active':''}" onclick="App.setTab('mese')">🗓️ Calendario completo</button>
          <button class="${tab==='giorno'?'active':''}" onclick="App.setTab('giorno')">➕ Aggiungi giorno</button>
          <button class="${tab==='lavoro'?'active':''}" onclick="App.setTab('lavoro')">🛠️ Nuovo lavoro</button>
          <button class="${tab==='attesa'?'active':''}" onclick="App.setTab('attesa')">⏳ In attesa</button>
          <button class="${tab==='assistenza'?'active':''}" onclick="App.setTab('assistenza')">🔧 Assistenza</button>
        </nav>
      </div>
      <main>
        ${saveErr ? '<div class="banner-err"><strong>Il salvataggio non è riuscito.</strong>Controlla la connessione internet e che le chiavi Supabase nel codice siano corrette. Le ultime modifiche potrebbero non essere state salvate.</div>' : ''}
        ${tab === 'calendario' ? renderCalendario() : ''}
        ${tab === 'mese' ? renderCalendarioMese() : ''}
        ${tab === 'giorno' ? renderAggiungiGiorno() : ''}
        ${tab === 'lavoro' ? renderNuovoLavoro() : ''}
        ${tab === 'attesa' ? renderInAttesa() : ''}
        ${tab === 'assistenza' ? renderAssistenza() : ''}
      </main>`;
    root.innerHTML = html;
  }

  function exportData(){
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    const stamp = d.toISOString().slice(0,10);
    a.href = url;
    a.download = 'cantieri-stufe-' + stamp + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function importData(event){
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed || !parsed.teams || !Array.isArray(parsed.slots) || !Array.isArray(parsed.jobs)) {
          alert('File non valido: non sembra un backup di questa app.');
          return;
        }
        if (!Array.isArray(parsed.assistances)) parsed.assistances = [];
        data = parsed;
        persist();
        alert('Dati importati correttamente.');
      } catch(e) {
        alert('Non sono riuscito a leggere il file. Controlla che sia il backup giusto.');
      }
      event.target.value = '';
    };
    reader.readAsText(file);
  }

  window.App = {
    setTab, addSlot, addJob, unassignSlot, removeSlot, requestRemoveSlot, assignJobToSlot, deleteJob, requestDeleteJob,
    addAssist, toggleAssistDone, requestDeleteAssist,
    exportData, importData,
    toggleAssign: (id) => { assigningJobId = assigningJobId === id ? null : id; render(); },
    toggleExpand: (slotId) => { expandedSlotId = expandedSlotId === slotId ? null : slotId; render(); },
    toggleExpandJob: (jobId) => { expandedJobId = expandedJobId === jobId ? null : jobId; render(); },
    toggleExpandAssist: (id) => { expandedAssistId = expandedAssistId === id ? null : id; render(); },
    toggleAssistForm: () => { assistFormOpen = !assistFormOpen; render(); },
    toggleMenu: () => { menuOpen = !menuOpen; render(); },
    calPrevMonth, calNextMonth, calSelectDay,
    setFormGiornoTeam: (t) => { formGiorno.team = t; render(); },
    setFormGiorno: (k, v) => { formGiorno[k] = v; },
    setFormLavoro: (k, v) => { formLavoro[k] = v; if (k === 'slotId') render(); },
    setFormAssist: (k, v) => { formAssist[k] = v; if (k === 'date') render(); }
  };

  load();
})();
</script>
</body>
</html>
