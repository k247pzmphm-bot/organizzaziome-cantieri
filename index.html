<style>
  :root{
    color-scheme:light;
    --bg:#F5F2EC;
    --panel:#FFFFFF;
    --ink:#332E28;
    --ink-soft:#8A8175;
    --line:#E7E1D5;
    --ember:#2E5A40;
    --ember-soft:#DCE7DE;
    --teal:#1D3E66;
    --teal-soft:#E2E7EE;
    --amber:#A5793A;
    --amber-soft:#F1E6D3;
    --free:#54886A;
    --free-soft:#E4EEE7;
    --error:#B2503F;
    --error-soft:#F4E1DB;
    --extra:#6B5B95;
    --extra-soft:#E7E3EF;
    --glass-blur:0px;
    --card-border:var(--line);
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#15120E;
    --panel:rgba(35,30,24,0.6);
    --ink:#F3EEE5;
    --ink-soft:#A69C8C;
    --line:rgba(243,238,229,0.10);
    --ember:#2E9E78;
    --ember-soft:rgba(46,158,120,0.18);
    --teal:#5FAEEA;
    --teal-soft:rgba(95,174,234,0.16);
    --amber:#EFB550;
    --amber-soft:rgba(239,181,80,0.16);
    --free:#6BCB8A;
    --free-soft:rgba(107,203,138,0.16);
    --error:#F0776A;
    --error-soft:rgba(240,119,106,0.16);
    --extra:#B29AE8;
    --extra-soft:rgba(178,154,232,0.16);
    --glass-blur:16px;
    --card-border:rgba(243,238,229,0.10);
  }
  :root[data-theme="dark"] body{
    background:
      radial-gradient(circle at 15% -8%, rgba(46,158,120,0.16), transparent 42%),
      radial-gradient(circle at 100% 15%, rgba(95,174,234,0.13), transparent 40%),
      radial-gradient(circle at 50% 100%, rgba(178,154,232,0.08), transparent 45%),
      var(--bg);
  }
  :root[data-theme="dark"] .day-card,
  :root[data-theme="dark"] .pending-card,
  :root[data-theme="dark"] header.top,
  :root[data-theme="dark"] .drawer,
  :root[data-theme="dark"] .stats-teaser,
  :root[data-theme="dark"] .cal-cell,
  :root[data-theme="dark"] .quick-actions button,
  :root[data-theme="dark"] .month-nav button,
  :root[data-theme="dark"] .menu-btn,
  :root[data-theme="dark"] .theme-toggle,
  :root[data-theme="dark"] .field input,
  :root[data-theme="dark"] .field select,
  :root[data-theme="dark"] .field textarea,
  :root[data-theme="dark"] .slot-pick,
  :root[data-theme="dark"] .team-choice button,
  :root[data-theme="dark"] .year-pick button{
    backdrop-filter:blur(var(--glass-blur));
    -webkit-backdrop-filter:blur(var(--glass-blur));
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #root{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

  header.top{
    padding:22px 18px 16px;
    position:sticky; top:0; z-index:10;
    background:var(--bg);
    box-shadow:0 1px 0 rgba(51,46,40,0.06), 0 6px 16px rgba(51,46,40,0.04);
    display:flex;
    align-items:flex-start;
    justify-content:flex-start;
    gap:12px;
  }
  .brand{display:flex;align-items:baseline;gap:8px;}
  .header-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .header-clock{text-align:right;padding-top:3px;}
  .theme-toggle{
    width:34px;height:34px;flex-shrink:0;
    border:1px solid var(--line);background:var(--panel);
    border-radius:7px;font-size:15px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .1s ease;
  }
  .theme-toggle:active{transform:scale(0.92);}
  .header-clock-date{font-size:10.5px;font-weight:600;color:var(--ink-soft);text-transform:capitalize;}
  .header-clock-time{font-size:19px;font-weight:700;color:var(--ink);letter-spacing:0.02em;font-variant-numeric:tabular-nums;}
  .brand .flame{font-size:20px;}
  h1{
    font-weight:700;
    font-size:23px;
    margin:0;
    letter-spacing:-0.01em;
  }
  .sub{color:var(--ink-soft);font-size:13px;margin-top:4px;}

  .menu-btn{
    flex-shrink:0;
    width:40px;height:40px;
    border:1px solid var(--line);
    background:var(--panel);
    border-radius:7px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    margin-top:2px;
    box-shadow:0 1px 2px rgba(51,46,40,0.05), 0 3px 8px rgba(51,46,40,0.04);
    transition:transform .1s ease;
  }
  .menu-btn:active{transform:scale(0.94);}
  .menu-btn span{display:block;width:16px;height:2px;background:var(--ink);position:relative;}
  .menu-btn span::before, .menu-btn span::after{
    content:'';position:absolute;left:0;width:16px;height:2px;background:var(--ink);
  }
  .menu-btn span::before{top:-5px;}
  .menu-btn span::after{top:5px;}

  .drawer-overlay{
    position:fixed;inset:0;background:rgba(34,31,28,0.35);
    z-index:19;
    opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .drawer-overlay.open{opacity:1;pointer-events:auto;}

  .drawer{
    position:fixed;top:0;left:0;bottom:0;
    width:78%;max-width:300px;
    background:var(--panel);
    z-index:20;
    box-shadow:2px 0 24px rgba(34,31,28,0.18);
    transform:translateX(-100%);
    transition:transform .22s ease;
    display:flex;flex-direction:column;
    padding:20px 0;
  }
  .drawer.open{transform:translateX(0);}
  .drawer-head{
    padding:0 20px 18px;
    border-bottom:1px solid var(--line);
    margin-bottom:8px;
    font-weight:700;font-size:16px;
    display:flex;align-items:center;gap:8px;
  }
  .drawer-nav button{
    display:block;
    width:100%;
    text-align:left;
    border:none;background:transparent;
    padding:14px 20px;
    font-size:15px;font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
    border-left:3px solid transparent;
  }
  .drawer-nav button.active{
    color:var(--ember);
    background:var(--ember-soft);
    border-left-color:var(--ember);
  }
  .menu-badge{
    display:inline-block;min-width:18px;padding:1px 5px;
    background:var(--error);color:#fff;
    border-radius:7px;font-size:11px;font-weight:700;
    text-align:center;vertical-align:middle;
  }
  .menu-chevron{
    display:inline-block;font-size:16px;color:var(--ink-soft);
    transition:transform .2s ease;
  }
  .menu-chevron.open{transform:rotate(90deg);}
  .submenu-btn{
    padding-left:44px !important;
    font-size:13.5px !important;
  }

  .quick-actions{
    display:grid;grid-template-columns:repeat(4,1fr);gap:6px;
    margin-bottom:22px;
  }
  .quick-actions button{
    display:flex;flex-direction:column;align-items:center;gap:4px;
    border:1px solid var(--line);background:var(--panel);
    border-radius:7px;padding:10px 4px;
    font-size:11px;font-weight:600;color:var(--ink);
    cursor:pointer;
  }

  .stats-teaser{
    display:flex;align-items:center;gap:12px;
    background:var(--panel);border:1px solid var(--line);
    border-radius:6px;padding:14px 16px;
    margin-bottom:22px;cursor:pointer;
  }
  .stats-teaser-icon{font-size:22px;}
  .stats-teaser-text{flex:1;}
  .stats-teaser-title{font-weight:700;font-size:14.5px;}
  .stats-teaser-sub{font-size:12px;color:var(--ink-soft);margin-top:1px;}
  .stats-teaser-arrow{font-size:20px;color:var(--ink-soft);}

  .two-col > div, .home-grid > div{min-width:0;}

  .year-pick{display:flex;gap:6px;margin-bottom:14px;}
  .year-pick button{
    border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);
    border-radius:7px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .year-pick button.sel{background:var(--ember);color:#fff;border-color:var(--ember);}

  main{flex:1;padding:16px 18px 100px;}

  .tool-wrap{
    margin:-16px -18px -100px;
    height:calc(100vh - 96px);
    min-height:520px;
    overflow:hidden;
  }
  .tool-wrap iframe{width:100%;height:100%;border:none;display:block;background:#181410;}
  @media (min-width: 900px){
    .tool-wrap{
      margin:0;
      border-radius:8px;
      height:78vh;
      min-height:600px;
      box-shadow:0 1px 2px rgba(51,46,40,0.04), 0 4px 14px rgba(51,46,40,0.05);
    }
  }

  .empty{
    text-align:center;
    padding:48px 20px;
    color:var(--ink-soft);
  }
  .empty .flame{font-size:28px;display:block;margin-bottom:10px;}

  .month-label{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-soft);
    margin:22px 0 10px;
    font-weight:600;
  }
  .month-label:first-child{margin-top:0;}

  .month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .month-nav button{
    border:1px solid var(--line);background:var(--panel);color:var(--ink);
    width:34px;height:34px;border-radius:7px;font-size:17px;cursor:pointer;
    box-shadow:0 1px 2px rgba(51,46,40,0.05);
    transition:transform .1s ease;
  }
  .month-nav button:active{transform:scale(0.92);}
  .month-nav-label{font-weight:700;font-size:15px;}

  .week-labels{
    display:grid;grid-template-columns:repeat(7,1fr);
    text-align:center;font-size:11px;color:var(--ink-soft);font-weight:600;
    margin-bottom:6px;
  }

  .month-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:64px;gap:5px;margin-bottom:10px;}
  .cal-cell{
    height:64px;
    display:flex;flex-direction:column;align-items:stretch;gap:2px;
    padding:4px 3px;
    border-radius:7px;cursor:pointer;
    background:var(--panel);border:1px solid var(--line);
    overflow:hidden;
    transition:transform .1s ease;
  }
  .cal-cell:active{transform:scale(0.95);}
  .cal-cell.empty{visibility:hidden;cursor:default;}
  .cal-cell.today{border-color:var(--ember); box-shadow:0 0 0 1px var(--ember);}
  .cal-cell.selected{background:var(--ember-soft);border-color:var(--ember);}
  .cal-cell.holiday{background:var(--free-soft);}
  .cal-daynum{font-size:10.5px;font-weight:700;text-align:center;color:var(--ink-soft);flex-shrink:0;}
  .cal-cell.today .cal-daynum{color:var(--ember);}
  .holiday-mark{color:var(--free);font-size:6px;vertical-align:middle;}
  .cal-events{display:flex;flex-direction:column;gap:2px;overflow:hidden;}
  .cal-event-chip{
    font-size:8px;line-height:1.3;font-weight:700;
    padding:1.5px 3px;border-radius:4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    color:#fff;flex-shrink:0;
  }
  .cal-event-chip.A{background:var(--teal);}
  .cal-event-chip.B{background:var(--amber);}
  .cal-event-chip.free{background:transparent;border:1px solid var(--free);color:var(--free);}
  .cal-event-chip.assist{background:var(--error);}
  .cal-event-chip.extra{background:var(--extra);}

  .cal-legend{
    display:flex;flex-wrap:wrap;gap:10px;
    font-size:11px;color:var(--ink-soft);font-weight:600;
    margin-bottom:18px;
  }
  .cal-legend span{display:flex;align-items:center;gap:4px;}
  .cal-legend-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .cal-legend-dot.A{background:var(--teal);}
  .cal-legend-dot.B{background:var(--amber);}
  .cal-legend-dot.assist{background:var(--error);}
  .cal-legend-dot.extra{background:var(--extra);}
  .cal-legend-dot.holiday{background:var(--free);}

  .holiday-banner{
    background:var(--free-soft);color:var(--free);
    font-weight:700;font-size:13px;
    padding:8px 12px;border-radius:6px;margin-bottom:12px;
  }

  .day-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    margin-bottom:12px;
    overflow:hidden;
    box-shadow:0 1px 2px rgba(51,46,40,0.04), 0 4px 14px rgba(51,46,40,0.05);
  }
  .day-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 14px 8px;
  }
  .day-date{font-weight:700;font-size:15px;}

  .slot-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 14px;
    border-top:1px solid var(--line);
  }
  .team-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .team-dot.A{background:var(--teal);}
  .team-dot.B{background:var(--amber);}

  .slot-info{flex:1;min-width:0;}
  .slot-team{font-size:11px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:0.03em;}
  .slot-main{font-size:14px;font-weight:600;margin-top:1px;}
  .slot-main.free{color:var(--free);}
  .slot-detail{font-size:12.5px;color:var(--ink-soft);margin-top:1px;}

  .badge{
    font-size:11px;
    font-weight:700;
    padding:3px 9px;
    border-radius:7px;
    flex-shrink:0;
    white-space:nowrap;
  }
  .badge.free{background:var(--free-soft);color:var(--free);}
  .badge.busy{background:var(--ember-soft);color:var(--ember);}

  .slot-row button.icon-btn{
    border:none;background:none;color:var(--ink-soft);
    font-size:16px;cursor:pointer;padding:4px 6px;flex-shrink:0;
  }
  .expand-arrow{
    font-size:11px;color:var(--ink-soft);flex-shrink:0;transition:transform .15s;
  }
  .expand-arrow.open{transform:rotate(180deg);}

  .job-expand{
    padding:4px 14px 14px 33px;
    display:flex;flex-direction:column;gap:7px;
  }
  .job-expand-row{display:flex;gap:10px;font-size:13.5px;}
  .jx-label{
    flex:0 0 78px;color:var(--ink-soft);font-size:11.5px;font-weight:600;
    text-transform:uppercase;letter-spacing:0.02em;padding-top:1px;
  }
  .jx-val{flex:1;color:var(--ink);word-break:break-word;}
  .jx-link{color:var(--teal);text-decoration:none;font-weight:600;}
  .del-job-btn{
    align-self:flex-start;
    border:none;background:var(--error-soft);color:var(--error);
    border-radius:6px;padding:7px 12px;font-size:12.5px;font-weight:600;
    cursor:pointer;margin-top:4px;
  }
  .del-job-btn.confirming, .pending-card .actions button.del.confirming, .icon-btn.confirming{
    background:var(--error);color:#fff;
  }

  form{display:flex;flex-direction:column;gap:14px;}
  .field label{
    display:block;font-size:12px;font-weight:600;color:var(--ink-soft);
    margin-bottom:6px;text-transform:uppercase;letter-spacing:0.03em;
  }
  .field input, .field select, .field textarea{
    width:100%;
    border:1px solid var(--line);
    background:var(--panel);
    border-radius:6px;
    padding:11px 12px;
    font-family:inherit;
    font-size:15px;
    color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:60px;}
  .team-choice{display:flex;gap:8px;}
  .team-choice button{
    flex:1;
    border:1.5px solid var(--line);
    background:var(--panel);
    border-radius:6px;
    padding:10px;
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .team-choice button.sel.A{border-color:var(--teal);background:var(--teal-soft);color:var(--teal);}
  .team-choice button.sel.B{border-color:var(--amber);background:var(--amber-soft);color:var(--amber);}

  .primary-btn{
    background:var(--ember);
    color:#fff;
    border:none;
    border-radius:6px;
    padding:14px;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    margin-top:4px;
    box-shadow:0 4px 14px rgba(46,90,64,0.28);
    transition:transform .1s ease, box-shadow .1s ease;
  }
  .primary-btn:active{
    transform:scale(0.98);
    box-shadow:0 2px 6px rgba(46,90,64,0.22);
  }
  .cancel-btn{
    background:transparent;
    color:var(--ink-soft);
    border:none;
    padding:8px;
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
  }

  .ready-dot{
    width:12px;height:12px;border-radius:50%;
    border:none;cursor:pointer;flex-shrink:0;padding:0;
    display:inline-block;vertical-align:middle;margin-right:7px;
  }
  .ready-dot.green{background:var(--free);}
  .ready-dot.red{background:var(--error);}

  .slot-pick{
    display:flex;flex-direction:column;gap:6px;
    max-height:280px;overflow:auto;
    border:1px solid var(--line);border-radius:6px;padding:6px;
    background:var(--bg);
  }
  .slot-pick .opt{
    display:flex;align-items:center;gap:10px;
    padding:11px 12px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;
    color:var(--ink);
    border:1px solid transparent;
  }
  .slot-pick .opt:hover{background:var(--panel);}
  .slot-pick .opt.sel{background:var(--ember-soft);border-color:var(--ember);color:var(--ember);}
  .slot-pick .opt .opt-team-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:var(--ink-soft);}
  .slot-pick .opt .opt-team-dot.A{background:var(--teal);}
  .slot-pick .opt .opt-team-dot.B{background:var(--amber);}
  .slot-pick .opt input[type="radio"]{
    appearance:none;-webkit-appearance:none;
    width:19px;height:19px;flex-shrink:0;
    border-radius:50%;border:2px solid var(--ink-soft);
    background:var(--panel);
    cursor:pointer;position:relative;margin:0;
  }
  .slot-pick .opt input[type="radio"]:checked{border-color:var(--ember);}
  .slot-pick .opt input[type="radio"]:checked::after{
    content:'';position:absolute;top:50%;left:50%;
    width:10px;height:10px;border-radius:50%;
    background:var(--ember);transform:translate(-50%,-50%);
  }
  .slot-pick .empty-note{font-size:13px;color:var(--ink-soft);padding:6px;}

  .pending-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:3px solid var(--ember);
    border-radius:6px;
    padding:13px 15px;
    margin-bottom:11px;
    box-shadow:0 1px 2px rgba(51,46,40,0.04), 0 4px 14px rgba(51,46,40,0.05);
  }
  .pending-card .name{font-weight:700;font-size:14.5px;}
  .pending-card .meta{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .pending-card .actions{display:flex;gap:6px;margin-top:10px;flex-wrap:nowrap;overflow-x:auto;}
  .pending-card .actions button{
    border:none;border-radius:6px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer;
    white-space:nowrap;flex-shrink:0;
  }
  .pending-card .actions .assign{background:var(--ember);color:#fff;}
  .pending-card .actions .del{background:var(--bg);color:var(--ink-soft);}
  .cal-export-link{
    display:inline-block;
    font-size:12px;font-weight:700;
    color:var(--teal);cursor:pointer;
    margin-top:6px;
  }

  .banner-err{
    background:var(--error-soft);color:var(--error);padding:12px 14px;border-radius:6px;font-size:13px;margin-bottom:12px;line-height:1.5;
  }
  .banner-err strong{display:block;margin-bottom:3px;}
  .loading{padding:40px;text-align:center;color:var(--ink-soft);}

  ::-webkit-scrollbar{width:0;height:0;}
  /* ===== DESKTOP (schermi larghi) ===== */
  @media (min-width: 900px){
    #root{ max-width:none; width:100%; }

    .menu-btn{ display:none; }
    .drawer-overlay{ display:none !important; }
    .drawer{
      transform:none;
      box-shadow:1px 0 0 var(--card-border);
      width:250px;
    }

    header.top{ padding-left:280px; }
    main{
      margin-left:250px;
      max-width:1180px;
      padding:22px 32px 100px;
    }

    .two-col{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:28px;
      align-items:start;
    }
    .home-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(300px, 1fr));
      gap:28px;
      align-items:start;
    }
    .month-grid{ grid-auto-rows:84px; }
    .cal-cell{ height:84px; padding:6px 5px; }
    .cal-event-chip{ font-size:9px; }
    .quick-actions{ grid-template-columns:repeat(4, 160px); }
  }
</style>
</head>

  function loadTheme(){

    return 'dark';
  }
  let theme = loadTheme();
  function applyTheme(){
    document.documentElement.setAttribute('data-theme', theme);
  }
  function toggleTheme(){
    theme = theme === 'dark' ? 'light' : 'dark';

    applyTheme();
    render();
  }

  function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

  function fmtDate(iso){
    const d = new Date(iso+'T00:00:00');
    return { day: d.getDate(), dow: DOW[d.getDay()], month: d.getMonth(), year: d.getFullYear() };
  }
  function esc(s){
    return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function icsEscape(s){
    return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
  }
  function pad2(n){ return String(n).padStart(2,'0'); }

  // Esporta un singolo evento come file .ics: su iPhone apre direttamente
  // la schermata "Aggiungi a Calendario" di Apple Calendario.
  function exportEventToCalendar(opts){
    let dtstartLine, dtendLine;
    if (opts.time) {
      const start = new Date(opts.date + 'T' + opts.time + ':00');
      const end = new Date(start.getTime() + (opts.durationMinutes || 60) * 60000);
      const fmt = d => `${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}T${pad2(d.getHours())}${pad2(d.getMinutes())}00`;
      dtstartLine = `DTSTART:${fmt(start)}`;
      dtendLine = `DTEND:${fmt(end)}`;
    } else {
      const d0 = new Date(opts.date + 'T00:00:00');
      const d1 = new Date(d0); d1.setDate(d1.getDate() + 1);
      const f = d => `${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}`;
      dtstartLine = `DTSTART;VALUE=DATE:${f(d0)}`;
      dtendLine = `DTEND;VALUE=DATE:${f(d1)}`;
    }
    const now = new Date();
    const stamp = `${now.getUTCFullYear()}${pad2(now.getUTCMonth()+1)}${pad2(now.getUTCDate())}T${pad2(now.getUTCHours())}${pad2(now.getUTCMinutes())}${pad2(now.getUTCSeconds())}Z`;
    const lines = [
      'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Cantieri Stufe//IT','CALSCALE:GREGORIAN',
      'BEGIN:VEVENT',
      'UID:' + uid() + '@cantieristufe',
      'DTSTAMP:' + stamp,
      dtstartLine, dtendLine,
      'SUMMARY:' + icsEscape(opts.title)
    ];
    if (opts.location) lines.push('LOCATION:' + icsEscape(opts.location));
    if (opts.notes) lines.push('DESCRIPTION:' + icsEscape(opts.notes));
    lines.push('END:VEVENT','END:VCALENDAR');
    const blob = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    window.location.href = url;
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  function exportJobToCalendar(jobId){
    const job = data.jobs.find(j => j.id === jobId);
    if (!job || !job.slotId) return;
    const slot = data.slots.find(s => s.id === job.slotId);
    if (!slot) return;
    const notesParts = [job.product, job.notes].filter(Boolean);
    exportEventToCalendar({
      title: 'Cantiere: ' + job.client,
      date: slot.date,
      location: job.address,
      notes: notesParts.join(' — ')
    });
  }

  function exportAssistToCalendar(id){
    const a = data.assistances.find(x => x.id === id);
    if (!a || !a.date) return;
    const notesParts = [a.description, a.notes].filter(Boolean);
    exportEventToCalendar({
      title: 'Assistenza: ' + a.client,
      date: a.date,
      time: a.time || '',
      location: a.address,
      notes: notesParts.join(' — ')
    });
  }

  function exportApptToCalendar(id){
    const a = data.appointments.find(x => x.id === id);
    if (!a) return;
    exportEventToCalendar({
      title: a.title,
      date: a.date,
      time: a.time || '',
      notes: a.notes
    });
  }

  async function load(){
    try {
      const { data: row, error } = await sb.from('app_storage').select('value').eq('key', STORAGE_KEY).maybeSingle();
      if (error) throw error;
      if (row && row.value) data = row.value;
    } catch(e) { /* nessun dato salvato ancora, o errore di connessione: si parte da dati vuoti */ }
    if (!Array.isArray(data.assistances)) data.assistances = [];
    if (!Array.isArray(data.appointments)) data.appointments = [];
    // migrazione: se erano ancora i nomi generici di prima, passa ai nomi reali
    if (data.teams && data.teams.A === 'Squadra 1' && data.teams.B === 'Squadra 2') {
      data.teams = { A: 'DaFra', B: 'Arte Fuoco' };
      persist();
      return;
    }
    // migrazione: rinomina la squadra "Fra" nel nuovo nome "DaFra"
    if (data.teams && data.teams.A === 'Fra') {
      data.teams.A = 'DaFra';
      persist();
      return;
    }
    render();
  }

  async function persist(){
    try {
      const { error } = await sb.from('app_storage').upsert({ key: STORAGE_KEY, value: data, updated_at: new Date().toISOString() });
      saveErr = !!error;
    } catch(e) { saveErr = true; }
    render();
  }

  function easterDate(year){
    const a = year % 19, b = Math.floor(year/100), c = year % 100;
    const d = Math.floor(b/4), e = b % 4, f = Math.floor((b+8)/25);
    const g = Math.floor((b-f+1)/3), h = (19*a + b - d - g + 15) % 30;
    const i = Math.floor(c/4), k = c % 4;
    const l = (32 + 2*e + 2*i - h - k) % 7;
    const m = Math.floor((a + 11*h + 22*l) / 451);
    const month = Math.floor((h + l - 7*m + 114) / 31);
    const day = ((h + l - 7*m + 114) % 31) + 1;
    return new Date(year, month-1, day);
  }

  function italianHolidays(year){
    const fixed = [
      [1,1,'Capodanno'], [1,6,'Epifania'], [4,25,'Liberazione'],
      [5,1,'Festa dei Lavoratori'], [6,2,'Festa della Repubblica'],
      [8,15,'Ferragosto'], [11,1,'Ognissanti'], [12,8,'Immacolata Concezione'],
      [12,25,'Natale'], [12,26,'Santo Stefano']
    ];
    const map = {};
    fixed.forEach(([m,d,name]) => {
      map[`${year}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`] = name;
    });
    const pasquetta = easterDate(year);
    pasquetta.setDate(pasquetta.getDate() + 1);
    map[`${pasquetta.getFullYear()}-${String(pasquetta.getMonth()+1).padStart(2,'0')}-${String(pasquetta.getDate()).padStart(2,'0')}`] = 'Pasquetta';
    return map;
  }

  function jobCard(job, isPending){
    const isOpen = expandedJobId === job.id;
    const meta = [job.product, job.phone, job.address].filter(Boolean).map(esc).join(' · ') || 'Nessun dettaglio';
    let assignedInfo = '';
    if (!isPending && job.slotId) {
      const slot = data.slots.find(s => s.id === job.slotId);
      if (slot) {
        const { day, dow, month } = fmtDate(slot.date);
        assignedInfo = `<div class="meta" style="margin-top:2px;font-weight:700;color:var(--teal)">${day} ${MONTHS[month]} · ${dow} — ${esc(data.teams[slot.team])}</div>
        <div class="cal-export-link" onclick="event.stopPropagation();App.exportJobToCalendar('${job.id}')">📅 Aggiungi a Calendario iPhone</div>`;
      }
    }
    let html = `<div class="pending-card">
      <div onclick="App.toggleExpandJob('${job.id}')" style="cursor:pointer">
        <div class="name">${isPending ? `<button class="ready-dot ${job.ready?'green':'red'}" onclick="event.stopPropagation();App.toggleJobReady('${job.id}')" title="${job.ready?'Pronto':'Da organizzare'}"></button>` : ''}${esc(job.client)} <span class="expand-arrow ${isOpen?'open':''}">▾</span></div>
        <div class="meta">${meta}</div>
        ${assignedInfo}
      </div>`;
    if (isOpen) {
      html += `<div class="job-expand" style="padding-left:0">`;
      if (job.phone) html += `<div class="job-expand-row"><span class="jx-label">Telefono</span><a class="jx-val jx-link" href="tel:${esc(job.phone)}" onclick="event.stopPropagation()">${esc(job.phone)}</a></div>`;
      if (job.address) html += `<div class="job-expand-row"><span class="jx-label">Indirizzo</span><span class="jx-val">${esc(job.address)}</span></div>`;
      if (job.product) html += `<div class="job-expand-row"><span class="jx-label">Prodotto</span><span class="jx-val">${esc(job.product)}</span></div>`;
      if (job.notes) html += `<div class="job-expand-row"><span class="jx-label">Note</span><span class="jx-val">${esc(job.notes)}</span></div>`;
      html += `</div>`;
    }
    html += `<div class="actions">`;
    if (isPending) {
      html += `<button class="assign" onclick="App.toggleAssign('${job.id}')">${assigningJobId===job.id?'Chiudi':'Assegna a un giorno'}</button>`;
    } else {
      html += `<button class="assign" onclick="App.unassignSlot('${job.slotId}')">↺ Libera giorno</button>`;
    }
    html += `<button class="del" style="background:var(--panel);color:var(--ink-soft);border:1px solid var(--line)" onclick="App.startEditJob('${job.id}')">✎ Modifica</button>
        <button class="del ${confirmDeleteJobId===job.id?'confirming':''}" onclick="App.requestDeleteJob('${job.id}')">${confirmDeleteJobId===job.id?'Sicuro? Conferma':'Elimina'}</button>
      </div>`;
    if (isPending && assigningJobId === job.id) {
      const free = freeSlotsList();
      html += `<div class="slot-pick" style="margin-top:10px">`;
      if (free.length === 0) {
        html += `<div class="empty-note">Nessun giorno libero disponibile.</div>`;
      } else {
        free.forEach(s => {
          const { day, dow, month } = fmtDate(s.date);
          html += `<div class="opt" onclick="App.assignJobToSlot('${job.id}','${s.id}')"><span class="opt-team-dot ${s.team}"></span><span>${day} ${MONTHS[month]} · ${dow} — ${esc(data.teams[s.team])}</span></div>`;
        });
      }
      html += `</div>`;
    }
    html += `</div>`;
    return html;
  }

  function renderInAttesa(){
    let html = `<button class="primary-btn" style="margin-bottom:16px" onclick="App.toggleLavoroForm()">${jobFormOpen ? 'Chiudi' : '+ Nuovo lavoro'}</button>`;

    if (jobFormOpen) {
      if (editingJobId) html += `<div class="month-label" style="margin-top:0">✎ Modifica lavoro</div>`;
      const free = freeSlotsList(editingJobId);
      let slotPickHtml = '';
      if (free.length === 0) {
        slotPickHtml = `<div style="font-size:13px;color:var(--ink-soft)">Nessun giorno libero al momento. Il lavoro resterà "da assegnare" finché non aggiungi un giorno.</div>`;
      } else {
        slotPickHtml = `<div class="slot-pick">
          <label class="opt ${formLavoro.slotId===''?'sel':''}">
            <input type="radio" name="slot" ${formLavoro.slotId===''?'checked':''} onchange="App.setFormLavoro('slotId','')">
            <span>Non assegnare / lascia da assegnare</span>
          </label>`;
        free.forEach(s => {
          const { day, dow, month } = fmtDate(s.date);
          slotPickHtml += `<label class="opt ${formLavoro.slotId===s.id?'sel':''}">
            <input type="radio" name="slot" ${formLavoro.slotId===s.id?'checked':''} onchange="App.setFormLavoro('slotId','${s.id}')">
            <span class="opt-team-dot ${s.team}"></span>
            <span>${day} ${MONTHS[month]} · ${dow} — ${esc(data.teams[s.team])}</span>
          </label>`;
        });
        slotPickHtml += `</div>`;
      }
      html += `<form onsubmit="App.addJob(event)" style="margin-bottom:22px">
        <div class="field"><label>Cliente</label>
          <input type="text" value="${esc(formLavoro.client)}" oninput="App.setFormLavoro('client', this.value)" placeholder="Nome e cognome" required></div>
        <div class="field"><label>Telefono</label>
          <input type="text" value="${esc(formLavoro.phone)}" oninput="App.setFormLavoro('phone', this.value)" placeholder="333 1234567"></div>
        <div class="field"><label>Indirizzo</label>
          <input type="text" value="${esc(formLavoro.address)}" oninput="App.setFormLavoro('address', this.value)" placeholder="Via, città"></div>
        <div class="field"><label>Prodotto / modello</label>
          <input type="text" value="${esc(formLavoro.product)}" oninput="App.setFormLavoro('product', this.value)" placeholder="es. Stufa a pellet 9kW"></div>
        <div class="field"><label>Note</label>
          <textarea oninput="App.setFormLavoro('notes', this.value)" placeholder="Dettagli utili per il montaggio">${esc(formLavoro.notes)}</textarea></div>
        <div class="field"><label>Giorno / squadra assegnati</label>${slotPickHtml}</div>
        <button class="primary-btn" type="submit">${editingJobId ? 'Salva modifiche' : 'Salva lavoro'}</button>
        ${editingJobId ? `<button type="button" class="cancel-btn" onclick="App.cancelEditJob()">Annulla modifica</button>` : ''}
      </form>`;
    }

    const pending = data.jobs.filter(j => !j.slotId);
    const confirmed = data.jobs.filter(j => {
      if (!j.slotId) return false;
      const slot = data.slots.find(s => s.id === j.slotId);
      return slot && slot.date >= todayISO();
    }).sort((a,b) => {
      const sa = data.slots.find(s => s.id === a.slotId);
      const sb = data.slots.find(s => s.id === b.slotId);
      return (sa?sa.date:'9999').localeCompare(sb?sb.date:'9999');
    });

    if (pending.length === 0 && confirmed.length === 0) {
      html += '<div class="empty"><span class="flame">✅</span>Nessun lavoro in elenco.</div>';
      return html;
    }

    let pendingHtml = '';
    if (pending.length === 0) {
      pendingHtml = `<div class="empty" style="padding:16px 8px">Nessun lavoro da assegnare.</div>`;
    } else {
      pending.forEach(job => { pendingHtml += jobCard(job, true); });
    }

    let confirmedHtml = '';
    if (confirmed.length === 0) {
      confirmedHtml = `<div class="empty" style="padding:16px 8px">Nessun lavoro confermato.</div>`;
    } else {
      confirmed.forEach(job => { confirmedHtml += jobCard(job, false); });
    }

    html += `<div class="two-col">
      <div>
        <div class="month-label" style="margin-top:4px">Da assegnare</div>
        ${pendingHtml}
      </div>
      <div>
        <div class="month-label" style="margin-top:4px">Confermati <span style="font-weight:400;color:var(--ink-soft);text-transform:none;font-size:11.5px">(i cantieri passati sono nelle Statistiche)</span></div>
        ${confirmedHtml}
      </div>
    </div>`;
    return html;
  }

  function renderAssistenza(){
    let html = `<button class="primary-btn" style="margin-bottom:16px" onclick="App.toggleAssistForm()">${assistFormOpen ? 'Chiudi' : '+ Nuovo intervento'}</button>`;

    if (assistFormOpen) {
      if (editingAssistId) html += `<div class="month-label" style="margin-top:0">✎ Modifica intervento</div>`;
      html += `<form onsubmit="App.addAssist(event)" style="margin-bottom:22px">
        <div class="field"><label>Cliente</label>
          <input type="text" value="${esc(formAssist.client)}" oninput="App.setFormAssist('client', this.value)" placeholder="Nome e cognome" required></div>
        <div class="field"><label>Telefono</label>
          <input type="text" value="${esc(formAssist.phone)}" oninput="App.setFormAssist('phone', this.value)" placeholder="333 1234567"></div>
        <div class="field"><label>Indirizzo</label>
          <input type="text" value="${esc(formAssist.address)}" oninput="App.setFormAssist('address', this.value)" placeholder="Via, città"></div>
        <div class="field"><label>Problema / intervento richiesto</label>
          <input type="text" value="${esc(formAssist.description)}" oninput="App.setFormAssist('description', this.value)" placeholder="es. Stufa non si accende"></div>
        <div class="field"><label>Data prevista (opzionale)</label>
          <input type="date" value="${formAssist.date}" oninput="App.setFormAssist('date', this.value)">
          ${formAssist.date ? `<button type="button" class="cancel-btn" style="padding:6px 0" onclick="App.setFormAssist('date','')">✕ Rimuovi data</button>` : ''}
        </div>
        <div class="field"><label>Orario (opzionale)</label>
          <input type="time" value="${formAssist.time}" oninput="App.setFormAssist('time', this.value)">
          ${formAssist.time ? `<button type="button" class="cancel-btn" style="padding:6px 0" onclick="App.setFormAssist('time','')">✕ Rimuovi orario</button>` : ''}
        </div>
        <div class="field"><label>Note</label>
          <textarea oninput="App.setFormAssist('notes', this.value)" placeholder="Dettagli utili">${esc(formAssist.notes)}</textarea></div>
        <button class="primary-btn" type="submit">${editingAssistId ? 'Salva modifiche' : 'Salva intervento'}</button>
        ${editingAssistId ? `<button type="button" class="cancel-btn" onclick="App.cancelEditAssist()">Annulla modifica</button>` : ''}
      </form>`;
    }

    const pending = data.assistances.filter(a => !a.done).sort((a,b) => (a.date||'9999').localeCompare(b.date||'9999') || (a.time||'').localeCompare(b.time||''));
    const done = data.assistances.filter(a => a.done).sort((a,b) => b.createdAt.localeCompare(a.createdAt));

    if (pending.length === 0 && done.length === 0) {
      html += '<div class="empty"><span class="flame">🔧</span>Nessun intervento in elenco.</div>';
      return html;
    }

    function assistCard(a){
      const isOpen = expandedAssistId === a.id;
      const dateLabel = a.date ? (() => { const { day, dow, month } = fmtDate(a.date); return `${day} ${MONTHS[month]} · ${dow}${a.time? ' · '+esc(a.time) : ''}`; })() : 'Nessuna data';
      let c = `<div class="pending-card">
        <div onclick="App.toggleExpandAssist('${a.id}')" style="cursor:pointer">
          <div class="name"><button class="ready-dot ${a.ready?'green':'red'}" onclick="event.stopPropagation();App.toggleAssistReady('${a.id}')" title="${a.ready?'Pronto':'Da organizzare'}"></button>${esc(a.client)} <span class="expand-arrow ${isOpen?'open':''}">▾</span></div>
          <div class="meta">${esc(a.description) || 'Nessun dettaglio'} · ${dateLabel}</div>
        </div>`;
      if (a.date) c += `<div class="cal-export-link" onclick="App.exportAssistToCalendar('${a.id}')">📅 Aggiungi a Calendario iPhone</div>`;
      if (isOpen) {
        c += `<div class="job-expand" style="padding-left:0">`;
        if (a.phone) c += `<div class="job-expand-row"><span class="jx-label">Telefono</span><a class="jx-val jx-link" href="tel:${esc(a.phone)}" onclick="event.stopPropagation()">${esc(a.phone)}</a></div>`;
        if (a.address) c += `<div class="job-expand-row"><span class="jx-label">Indirizzo</span><span class="jx-val">${esc(a.address)}</span></div>`;
        if (a.description) c += `<div class="job-expand-row"><span class="jx-label">Intervento</span><span class="jx-val">${esc(a.description)}</span></div>`;
        if (a.date) c += `<div class="job-expand-row"><span class="jx-label">Data</span><span class="jx-val">${dateLabel}</span></div>`;
        if (a.notes) c += `<div class="job-expand-row"><span class="jx-label">Note</span><span class="jx-val">${esc(a.notes)}</span></div>`;
        c += `</div>`;
      }
      c += `<div class="actions">
          <button class="assign" onclick="App.toggleAssistDone('${a.id}')">${a.done ? '↺ Riapri' : '✓ Segna fatto'}</button>
          <button class="del" style="background:var(--panel);color:var(--ink-soft);border:1px solid var(--line)" onclick="App.startEditAssist('${a.id}')">✎ Modifica</button>
          <button class="del ${confirmDeleteAssistId===a.id?'confirming':''}" onclick="App.requestDeleteAssist('${a.id}')">${confirmDeleteAssistId===a.id?'Sicuro? Conferma':'Elimina'}</button>
        </div>
      </div>`;
      return c;
    }

    let pendingHtml = '';
    if (pending.length > 0) pending.forEach(a => { pendingHtml += assistCard(a); });
    let doneHtml = '';
    if (done.length > 0) done.forEach(a => { doneHtml += assistCard(a); });

    html += `<div class="two-col">
      <div>
        <div class="month-label">Da fare</div>
        ${pending.length > 0 ? pendingHtml : '<div class="empty" style="padding:16px 8px">Nessun intervento da fare.</div>'}
      </div>
      <div>
        <div class="month-label">Completati</div>
        ${done.length > 0 ? doneHtml : '<div class="empty" style="padding:16px 8px">Nessun intervento completato.</div>'}
      </div>
    </div>`;
    return html;
  }

  function renderStatistiche(){
    const todayStr = todayISO();
    const currentYear = new Date().getFullYear();

    // "fatto" = lavoro con un giorno assegnato la cui data è oggi o già passata
    const doneAll = data.jobs
      .filter(j => j.slotId)
      .map(j => ({ job: j, slot: data.slots.find(s => s.id === j.slotId) }))
      .filter(x => x.slot && x.slot.date <= todayStr);

    let html = `<div class="month-label" style="margin-top:0">📊 Statistiche cantieri</div>
    <div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:16px">Conta solo i lavori (cantieri), non le assistenze.</div>`;

    // selettore anno semplice: anno corrente e i 2 precedenti, solo se hanno dati
    const yearsAvailable = Array.from(new Set(doneAll.map(x => x.slot.date.slice(0,4)))).sort().reverse();
    const year = statsYear && yearsAvailable.includes(statsYear) ? statsYear : String(currentYear);

    if (yearsAvailable.length > 1) {
      html += `<div class="year-pick">`;
      yearsAvailable.forEach(y => {
        html += `<button class="${y===year?'sel':''}" onclick="App.setStatsYear('${y}')">${y}</button>`;
      });
      html += `</div>`;
    }

    const yearJobs = doneAll.filter(x => x.slot.date.startsWith(year));
    const teamACount = yearJobs.filter(x => x.slot.team === 'A').length;
    const teamBCount = yearJobs.filter(x => x.slot.team === 'B').length;

    html += `<div class="day-card">
      <div class="slot-row"><div class="slot-info"><div class="slot-team">Totale ${year}</div><div class="slot-main">${yearJobs.length} cantieri</div></div></div>
      <div class="slot-row"><div class="slot-info"><div class="slot-team">${esc(data.teams.A)}</div><div class="slot-main">${teamACount} cantieri</div></div></div>
      <div class="slot-row"><div class="slot-info"><div class="slot-team">${esc(data.teams.B)}</div><div class="slot-main">${teamBCount} cantieri</div></div></div>
    </div>`;

    const byMonth = Array(12).fill(0);
    yearJobs.forEach(x => { byMonth[parseInt(x.slot.date.slice(5,7),10) - 1]++; });
    html += `<div class="month-label">Per mese — ${year}</div><div class="day-card">`;
    let anyMonth = false;
    MONTHS.forEach((m, i) => {
      if (byMonth[i] > 0) {
        anyMonth = true;
        html += `<div class="slot-row"><div class="slot-info"><div class="slot-main">${m}</div></div><span class="badge busy">${byMonth[i]}</span></div>`;
      }
    });
    if (!anyMonth) html += `<div class="empty" style="padding:16px">Nessun cantiere completato in questo anno.</div>`;
    html += `</div>`;

    html += `<div class="month-label">Totale storico</div>
    <div class="day-card"><div class="slot-row"><div class="slot-info"><div class="slot-main">${doneAll.length} cantieri in totale, da sempre</div></div></div></div>`;

    html += `<button class="cancel-btn" style="padding:10px 0;font-size:13.5px" onclick="App.toggleStatsList()">${statsListOpen ? '▾ Nascondi elenco cantieri' : '▸ Vedi elenco cantieri — ' + year}</button>`;
    if (statsListOpen) {
      const sortedYearJobs = yearJobs.slice().sort((a,b) => b.slot.date.localeCompare(a.slot.date));
      if (sortedYearJobs.length === 0) {
        html += `<div class="empty" style="padding:16px">Nessun cantiere da mostrare per il ${year}.</div>`;
      } else {
        html += `<div class="day-card">`;
        sortedYearJobs.forEach(({job, slot}) => {
          const { day, dow, month } = fmtDate(slot.date);
          html += `<div class="slot-row">
            <span class="team-dot ${slot.team}"></span>
            <div class="slot-info">
              <div class="slot-team">${day} ${MONTHS[month]} · ${dow} — ${esc(data.teams[slot.team])}</div>
              <div class="slot-main">${esc(job.client)}</div>
            </div>
          </div>`;
        });
        html += `</div>`;
      }
    }

    return html;
  }

      .filter(a => !a.done && a.date && a.date >= todayStr && a.date <= in14Str)
      .sort((a,b) => a.date.localeCompare(b.date) || (a.time||'').localeCompare(b.time||''));

        assistHtml += `<div class="slot-row" style="cursor:pointer" onclick="App.setTab('assistenza')">
          <div class="slot-info">
            <div class="slot-team">${day} ${MONTHS[month]} · ${dow}${a.time? ' · '+esc(a.time) : ''}</div>
            <div class="slot-main">${esc(a.client)}</div>
          </div>
        </div>`;
      });
      assistHtml += `</div>`;
    }

    // --- Prossimi appuntamenti extra (14 giorni) ---
    const upcomingAppt = data.appointments
      .filter(a => a.date >= todayStr && a.date <= in14Str)
      .sort((a,b) => a.date.localeCompare(b.date) || (a.time||'').localeCompare(b.time||''));

    let apptHtml = '';
    if (upcomingAppt.length > 0) {
      apptHtml = `<div class="day-card">`;
      upcomingAppt.forEach(a => {
        const { day, dow, month } = fmtDate(a.date);
        apptHtml += `<div class="slot-row" style="cursor:pointer" onclick="App.setTab('mese')">
          <div class="slot-info">
            <div class="slot-team">${day} ${MONTHS[month]} · ${dow}${a.time? ' · '+esc(a.time) : ''}</div>
            <div class="slot-main">${esc(a.title)}</div>
          </div>
        </div>`;
      });
      apptHtml += `</div>`;
    }

    html += `<div class="home-grid">
      <div>
        <div class="month-label">🔥 Prossimi lavori (14 giorni)</div>
        ${jobsHtml}
      </div>
      <div>
        <div class="month-label">🔧 Prossime assistenze (14 giorni)</div>
        ${assistHtml}
      </div>
      ${upcomingAppt.length > 0 ? `<div>
        <div class="month-label">📌 Prossimi appuntamenti (14 giorni)</div>
        ${apptHtml}
      </div>` : ''}
    </div>`;

    return html;
  }

  function render(){
    const root = document.getElementById('root');
    const jobsToOrganize = data.jobs.filter(j => !j.slotId && !j.ready).length;
    const assistToOrganize = data.assistances.filter(a => !a.done && !a.ready).length;
    let html = `
      <header class="top">
        <button class="menu-btn" onclick="App.toggleMenu()" aria-label="Apri menu"><span></span></button>
        <div>
          <div class="brand"><span class="flame">🔥</span><h1>Cantieri Stufe</h1></div>
          <div class="sub">Giorni squadre e lavori confermati</div>
        </div>
        <div class="header-right">
          <button class="theme-toggle" onclick="App.toggleTheme()" aria-label="Cambia tema">${theme==='dark' ? '☀️' : '🌙'}</button>
          <div class="header-clock">
            <div id="header-clock-date" class="header-clock-date"></div>
            <div id="header-clock-time" class="header-clock-time"></div>
          </div>
        </div>
      </header>
      <div class="drawer-overlay ${menuOpen?'open':''}" onclick="App.toggleMenu()"></div>
      <div class="drawer ${menuOpen?'open':''}">
        <div class="drawer-head"><span class="flame">🔥</span>Cantieri Stufe</div>
        <nav class="drawer-nav">
          <button class="${tab==='home'?'active':''}" onclick="App.setTab('home')">🏠 Home</button>
          <button class="${tab==='mese'?'active':''}" onclick="App.setTab('mese')">📅 Calendario</button>
          <button class="${tab==='calendario'?'active':''}" onclick="App.setTab('calendario')">🏗️ Giorni installatori</button>
          <button class="${tab==='attesa'?'active':''}" onclick="App.setTab('attesa')">🛠️ Lavori confermati${jobsToOrganize>0?` <span class="menu-badge">${jobsToOrganize}</span>`:''}</button>
          <button class="${tab==='assistenza'?'active':''}" onclick="App.setTab('assistenza')">🔧 Assistenze${assistToOrganize>0?` <span class="menu-badge">${assistToOrganize}</span>`:''}</button>
          <button class="${tab==='statistiche'?'active':''}" onclick="App.setTab('statistiche')">📊 Statistiche</button>
          <button class="${(tab==='tiraggio'||tab==='fabbisogno')?'active':''}" onclick="App.toggleCalcoliMenu()">
            <span style="display:flex;align-items:center;justify-content:space-between;">
              <span>🧮 Calcoli</span>
              <span class="menu-chevron ${calcoliMenuOpen?'open':''}">›</span>
            </span>
          </button>
          ${calcoliMenuOpen ? `
            <button class="submenu-btn ${tab==='fabbisogno'?'active':''}" onclick="App.setTab('fabbisogno')">♨️ Fabbisogno</button>
            <button class="submenu-btn ${tab==='tiraggio'?'active':''}" onclick="App.setTab('tiraggio')">🌡️ Tiraggio</button>
          ` : ''}
        </nav>
      </div>
      <main>
        ${saveErr ? '<div class="banner-err"><strong>Il salvataggio non è riuscito.</strong>Controlla la connessione internet e che le chiavi Supabase nel codice siano corrette. Le ultime modifiche potrebbero non essere state salvate.</div>' : ''}
        ${tab === 'home' ? renderHome() : ''}
        ${tab === 'fabbisogno' ? renderFabbisogno() : ''}
        ${tab === 'calendario' ? renderCalendario() : ''}
        ${tab === 'mese' ? renderCalendarioMese() : ''}
        ${tab === 'attesa' ? renderInAttesa() : ''}
        ${tab === 'assistenza' ? renderAssistenza() : ''}
        ${tab === 'statistiche' ? renderStatistiche() : ''}
        ${tab === 'tiraggio' ? renderTiraggio() : ''}
      </main>`;
    root.innerHTML = html;
    updateClock();
  }

  window.App = {
    setTab, quickAdd, toggleTheme, addSlot, toggleGiornoForm, addJob, toggleLavoroForm, startEditJob, cancelEditJob, unassignSlot, removeSlot, requestRemoveSlot, assignJobToSlot, deleteJob, requestDeleteJob,
    addAssist, startEditAssist, cancelEditAssist, toggleAssistDone, requestDeleteAssist,
    toggleJobReady, toggleAssistReady,
    exportJobToCalendar, exportAssistToCalendar, exportApptToCalendar,
    toggleAssign: (id) => { assigningJobId = assigningJobId === id ? null : id; render(); },
    toggleExpand: (slotId) => { expandedSlotId = expandedSlotId === slotId ? null : slotId; render(); },
    toggleExpandJob: (jobId) => { expandedJobId = expandedJobId === jobId ? null : jobId; render(); },
    toggleExpandAssist: (id) => { expandedAssistId = expandedAssistId === id ? null : id; render(); },
    toggleAssistForm: () => { assistFormOpen = !assistFormOpen; render(); },
    toggleMenu: () => { menuOpen = !menuOpen; render(); },
    toggleCalcoliMenu,
    calPrevMonth, calNextMonth, calSelectDay, setStatsYear, toggleStatsList,
    toggleApptForm, addAppt, requestDeleteAppt, setFormAppt,
    setFormGiornoTeam: (t) => { formGiorno.team = t; render(); },
    setFormGiorno: (k, v) => { formGiorno[k] = v; },
    setFormLavoro: (k, v) => { formLavoro[k] = v; if (k === 'slotId') render(); },
    setFormAssist: (k, v) => { formAssist[k] = v; if (k === 'date' || k === 'time') render(); }
  };

  // ====== PONTE COL RIQUADRO TIRAGGIO (isolato in un iframe) ======
  window.addEventListener('message', function(ev){
    const msg = ev.data;
    if (!msg || typeof msg !== 'object') return;
    if (msg.type === 'tiraggio-request-state') {
      if (ev.source && typeof ev.source.postMessage === 'function') {
        ev.source.postMessage({ type: 'tiraggio-state', payload: data.tiraggio || null }, '*');
      }
    } else if (msg.type === 'tiraggio-save') {
      data.tiraggio = msg.payload;
      const replySource = ev.source;
      persist().then(function(){
        if (replySource && typeof replySource.postMessage === 'function') {
          replySource.postMessage({ type: 'tiraggio-saved', ok: !saveErr }, '*');
        }
      });
    }
  });
  // ======================================

  if (isUnlocked()) {
    startApp();
  } else {
    renderLockScreen();
  }
})();
</script>
</body>
</html>
